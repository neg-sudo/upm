[package]
name = "upm"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Universal Package Manager — one CLI for brew, apt, dnf, pacman, zypper, winget, scoop and choco"
license = "MIT"
repository = "https://github.com/neg-sudo/upm"
homepage = "https://github.com/neg-sudo/upm"
documentation = "https://github.com/neg-sudo/upm#readme"
readme = "README.md"
keywords = ["package-manager", "cli", "cross-platform", "installer", "upm"]
categories = ["command-line-utilities", "development-tools"]
include = [
    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "install.sh",
    "install.ps1",
]

[[bin]]
name = "upm"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
dirs = "7"
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
which = "8"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "z"
panic = "abort"
