# upm alias registry
#
# Canonical name -> native package name per backend.
# Missing keys are fine: upm falls back to searching the backend, then to the
# raw name. Override or extend these in ~/.config/upm/config.toml:
#
#   [packages.nodejs]
#   apt = "nodejs"
#
# Homebrew casks are written as "cask:<name>".

[packages.nodejs]
brew = "node"
apt = "nodejs"
dnf = "nodejs"
pacman = "nodejs"
zypper = "nodejs"
winget = "OpenJS.NodeJS"
scoop = "nodejs"
choco = "nodejs"

